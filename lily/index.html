<!doctype html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="A small world made of things I noticed.">

  <link rel="preload" as="font" type="font/woff2" href="./fonts/caveat-latin-500-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="./fonts/cormorant-garamond-latin-400-italic.woff2" crossorigin>

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/bloom.css">
  <link rel="stylesheet" href="./css/garden.css">

</head>
<body>
  <div id="boot" aria-hidden="true"><i></i></div>
  <div id="stage" aria-live="polite"></div>

  <nav id="nav" aria-label="Navigation">
    <div class="nav__group">
      <button class="nav__btn" id="navBack" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>back</span>
      </button>
    </div>
    <div class="nav__group">
      <button class="nav__btn nav__btn--sound" id="navSound" type="button" aria-pressed="false" aria-label="Sound off. Turn sound on">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10v4h3l5 4V6L7 10H4z"/>
          <path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="wave" d="M17.8 7a7 7 0 0 1 0 10"/>
          <path class="slash" d="M16 9.5l4 5M20 9.5l-4 5"/>
        </svg><span class="sound__label">sound off</span>
      </button>
      <button class="nav__btn" id="navMenu" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </nav>

  <div id="menu" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
    <div class="menu__sheet">
      <p class="menu__title">Where to?</p>
      <button class="menu__item" type="button" data-go="replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg>replay this part</button>
      <button class="menu__item" type="button" data-go="garden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c-5 0-7-3-7-7 4 0 7 2 7 7z"/><path d="M12 13c5 0 7-3 7-7-4 0-7 2-7 7z"/></svg>the garden</button>
      <button class="menu__item" type="button" data-go="letter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 8l9 6 9-6"/></svg>read the letter again</button>
      <button class="menu__item" type="button" data-go="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-2 6-6 8-9 9 3 1 7 3 9 9 2-6 6-8 9-9-3-1-7-3-9-9z"/></svg>start from the beginning</button>
      <button class="menu__item menu__close" type="button" data-go="close">close</button>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;padding:32px;text-align:center;background:#07080b;color:#f3ead9;font-family:Georgia,serif">
      <div><p style="font-style:italic;font-size:22px">The Art of Noticing</p><p>This little world needs JavaScript to bloom. Please enable it and come back.</p></div>
    </div>
  </noscript>

</html>
